<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Explorer</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="app-shell">
      <section class="finder-window">
        <div class="finder-toolbar">
          <div class="window-controls">
            <span class="control red"></span>
            <span class="control yellow"></span>
            <span class="control green"></span>
          </div>
          <div class="toolbar-title">Explorer</div>
        </div>

        <div class="folder-grid">
          <button
            class="folder-item"
            type="button"
            onclick="togglePanel(this)"
            aria-expanded="false"
            aria-controls="detailsPanel">
            <span class="folder-icon">📁</span>
            <div>
              <div class="folder-name">Imam Portfolio</div>
              <div class="folder-meta">Open for quick links</div>
            </div>
          </button>

          <div class="details-panel collapsed" id="detailsPanel">
            <div class="panel-header">Quick links</div>
            <ul class="panel-list">
              <li>
                <a href="https://immsswd.github.io/portfolio/about">About</a>
              </li>
              <li>
                <a href="https://immsswd.github.io/portfolio/"
                  >Blog &amp; Portfolio</a
                >
              </li>
              <li>
                <a href="https://immsswd.github.io/portfolio/contact"
                  >Contact</a
                >
              </li>
            </ul>
          </div>

          <article class="folder-item disabled">
            <span class="folder-icon">📁</span>
            <div>
              <div class="folder-name">etc</div>
              <div class="folder-meta">Locked folder</div>
            </div>
          </article>

          <article class="folder-item disabled">
            <span class="folder-icon">📁</span>
            <div>
              <div class="folder-name">sys</div>
              <div class="folder-meta">Restricted access</div>
            </div>
          </article>

          <article class="folder-item disabled">
            <span class="folder-icon">📁</span>
            <div>
              <div class="folder-name">home</div>
              <div class="folder-meta">Personal directory</div>
            </div>
          </article>

          <article class="folder-item disabled">
            <span class="folder-icon">📁</span>
            <div>
              <div class="folder-name">dev</div>
              <div class="folder-meta">Development files</div>
            </div>
          </article>

          <article class="folder-item disabled">
            <span class="folder-icon">📁</span>
            <div>
              <div class="folder-name">root</div>
              <div class="folder-meta">System root</div>
            </div>
          </article>

          <article class="folder-item disabled">
            <span class="folder-icon">📁</span>
            <div>
              <div class="folder-name">media</div>
              <div class="folder-meta">Media archive</div>
            </div>
          </article>
        </div>
      </section>
    </div>

    <script>
      function togglePanel(button) {
        const panel = document.getElementById("detailsPanel");
        const expanded = panel.classList.toggle("collapsed");
        button.setAttribute("aria-expanded", String(!expanded));
      }
    </script>
  </body>
</html>
